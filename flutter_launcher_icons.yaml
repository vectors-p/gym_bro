flutter_launcher_icons:
  image_path: "assets/icon/app_launcher.png"

  android: true
  min_sdk_android: 21

  adaptive_icon_background: "#FF4500"
  adaptive_icon_foreground: "assets/icon/app_launcher.png"
  adaptive_icon_foreground_inset: 16 # optional (makes logo smaller)

  ios: true
  remove_alpha_ios: true

  web:
    generate: true
    image_path: "assets/icon/app_launcher.png"
    background_color: "#FF4500"
    theme_color: "#FF4500"

  windows:
    generate: true
    image_path: "assets/icon/app_launcher.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/icon/app_launcher.png"
